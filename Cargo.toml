[package]
authors = ["vyfor", "chikof"]
categories = ["command-line-utilities"]
description = "A presence plugin for Neovim that shows your activity in Duvet, powered by Rust."
edition = "2024"
keywords = ["duvet", "presence", "neovim", "plugin"]
license = "Apache-2.0"
name = "duvet-nvim"
repository = "https://github.com/chikof/duvet.nvim"
version = "2.3.29"
rust-version = "1.89.0"

[[bin]]
name = "duvet"
path = "src/main.rs"

[profile.release]
incremental = true
